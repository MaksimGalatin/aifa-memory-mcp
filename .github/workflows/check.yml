# Проверка описания облачного сервера (09.11.2026, по досье Antigravity и второму внешнему разбору: README и
# TOOLS.md отстали от живого сервера на две версии, и никто этого не видел).
# 1) server.json и примеры — правильный JSON; 2) server.json проходит проверку официального реестра MCP;
# 3) TOOLS.md совпадает с тем, что живой сервер отвечает на tools/list (без ключа, один запрос).
# Три числа (раздел 24): при каждой отправке и раз в неделю; цена 0 (публичный репозиторий); меньше одного запуска в сутки.
name: check

on:
  push:
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: JSON is valid
        run: python -c "import json, glob; [json.load(open(f, encoding='utf-8')) for f in ['server.json', *glob.glob('examples/*.json')]]; print('ok')"
      - name: server.json passes the MCP registry validator
        run: |
          curl -sSL -o mcp-publisher.tar.gz https://github.com/modelcontextprotocol/registry/releases/download/v1.8.8/mcp-publisher_linux_amd64.tar.gz
          echo "09f1fa70ee146b640584274a1a6b2b8a0310b05d4321fa9224e6df6a016d67f4  mcp-publisher.tar.gz" | sha256sum -c -
          tar -xzf mcp-publisher.tar.gz mcp-publisher
          ./mcp-publisher validate
      - name: TOOLS.md matches the live server
        run: |
          python scripts/make_tools_md.py
          git diff --exit-code TOOLS.md
